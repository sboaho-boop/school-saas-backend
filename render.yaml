services:
  - type: web
    name: eduplatform-backend
    runtime: node
    plan: free
    # NOTE: upgrade to at least a paid plan before official launch --
    # free instances spin down after inactivity (cold starts) and free
    # Postgres has no automated backups.
    buildCommand: npm install && npx prisma generate
    startCommand: node scripts/migrate.js && node src/index.js
    disk:
      name: uploads-data
      mountPath: /var/data/uploads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        value: xwLsLUMI0doNJ0X8mLoFCnaplsam1dDlkcGzTzG5eNGB9QOT2t4jLan9oAHxuWdC
      - key: BASE_URL
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PAYSTACK_PLAN_PRO_CODE
        sync: false
      - key: PAYSTACK_PLAN_UNLIMITED_CODE
        sync: false
      - key: PAYSTACK_PLAN_PRO_AMOUNT
        value: "19"
      - key: PAYSTACK_PLAN_UNLIMITED_AMOUNT
        value: "39"
      - key: UPLOAD_DIR
        value: /var/data/uploads